name: Sync Calendar

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'sync.php'
      - 'composer.json'
      - '.github/workflows/sync-calendar.yml'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, curl
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --optimize-autoloader

      - name: Run tests
        run: ./vendor/bin/phpunit tests/

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Run calendar sync
        run: php sync.php

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: sync sweeps"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Send failure email
        if: failure()
        env:
          SMTP_URL: ${{ secrets.SMTP_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ -z "$SMTP_URL" ]; then
            echo "SMTP secrets nejsou nastavene, notifikaci preskakuji."
            exit 0
          fi
          curl --ssl-reqd \
            --url "$SMTP_URL" \
            --user "$SMTP_USER:$SMTP_PASSWORD" \
            --mail-from "$MAIL_FROM" \
            --mail-rcpt "$MAIL_TO" \
            --upload-file - <<EOF
          From: $MAIL_FROM
          To: $MAIL_TO
          Subject: Cisteni BKOM sync failed

          Synchronizace kalendare blokoveho cisteni selhala.

          Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Zkontrolujte, zda se nezmenilo API na cisteni.bkom.cz.
          EOF
